name: UI Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs automatically on every push and pull request.
  # Only a small, stable subset: it exercises the framework end to end
  # (browser start, Page Object Model, assertions, Allure output) without
  # depending on cart/checkout flows that are flaky on a shared CI runner.
  smoke:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      - name: Run smoke subset
        env:
          BROWSER: chrome
          HEADLESS: "true"
        run: mvn -B test -Dtest=TestCase7,TestCase8,TestCase9

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-smoke
          path: allure-results/
          if-no-files-found: ignore

      - name: Upload TestNG reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-smoke
          path: target/surefire-reports/
          if-no-files-found: ignore

  # Manual only ("Run workflow" button in the Actions tab).
  # The full 26-test suite runs against the live public site, and that is
  # expected to be flaky on a shared runner, so it is never triggered
  # automatically.
  full-suite:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      - name: Run full Selenium suite (26 tests)
        env:
          BROWSER: chrome
          HEADLESS: "true"
        run: mvn -B test

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-full
          path: allure-results/
          if-no-files-found: ignore

      - name: Upload TestNG reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-full
          path: target/surefire-reports/
          if-no-files-found: ignore

name: UI Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs automatically on every push and pull request.
  # One smoke test only: it proves the framework can start a browser, reach the
  # live site, navigate and assert. The full 26-test suite depends on a
  # third-party site and is run manually (see the "full-suite" job), because
  # order-dependent, live-data tests flake on a shared CI runner.
  smoke:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      - name: Run smoke subset
        env:
          BROWSER: chrome
          HEADLESS: "true"
        # The target site is a third-party live site, so a single element can be
        # slow or missing on a shared runner. Retry a failed test up to twice
        # before failing the build, instead of reporting a product bug that is
        # actually network/timing noise.
        run: mvn -B test -Dtest=TestCase7 -Dsurefire.rerunFailingTestsCount=3

      - name: Show failure details
        if: failure()
        run: |
          echo "### Surefire results" >> "$GITHUB_STEP_SUMMARY"
          for f in target/surefire-reports/*.txt; do
            [ -e "$f" ] || continue
            echo "#### $(basename "$f")" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            head -60 "$f" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done
          grep -h -E "Tests run:" target/surefire-reports/*.txt 2>/dev/null | tail -1 | while IFS= read -r l; do echo "::error::$l"; done
          grep -h -E "<<< (FAILURE|ERROR)!" target/surefire-reports/*.txt 2>/dev/null | head -5 | while IFS= read -r l; do echo "::error::$l"; done
          grep -h -E "^(java\.lang\.|org\.openqa\.|org\.testng\.)" target/surefire-reports/*.txt 2>/dev/null | head -5 | while IFS= read -r l; do echo "::error::$l"; done

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-smoke
          path: allure-results/
          if-no-files-found: ignore

      - name: Upload TestNG reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-smoke
          path: target/surefire-reports/
          if-no-files-found: ignore

  # Manual only ("Run workflow" button in the Actions tab).
  # The full 26-test suite runs against the live public site, and that is
  # expected to be flaky on a shared runner, so it is never triggered
  # automatically.
  full-suite:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      - name: Run full Selenium suite (26 tests)
        env:
          BROWSER: chrome
          HEADLESS: "true"
        run: mvn -B test

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-full
          path: allure-results/
          if-no-files-found: ignore

      - name: Upload TestNG reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-full
          path: target/surefire-reports/
          if-no-files-found: ignore
